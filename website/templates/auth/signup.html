{% extends "base.html" %}
{% block title %}Sign up · Flask Connect{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card border-0 shadow-sm">
            <div class="card-body p-4">
                <h1 class="h3 mb-3 text-center">Create an account</h1>
                <form method="post" enctype="multipart/form-data" novalidate>
                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <input class="form-control" name="username" value="{{ username or '' }}" required minlength="3" maxlength="40">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input class="form-control" type="email" name="email" value="{{ email or '' }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input class="form-control" type="password" name="password" required minlength="8">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Confirm password</label>
                        <input class="form-control" type="password" name="confirm" required minlength="8">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Profile picture (optional)</label>
                        <input class="form-control" type="file" name="profile_pic" accept="image/*">
                    </div>
                    <button class="btn btn-primary w-100" type="submit">Sign up</button>
                </form>
                <p class="text-center text-muted mt-3 mb-0">
                    Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
