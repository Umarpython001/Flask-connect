{% extends "base.html" %}
{% block title %}Log in · Flask Connect{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">
        <div class="card border-0 shadow-sm">
            <div class="card-body p-4">
                <h1 class="h3 mb-3 text-center">Welcome back</h1>
                <form method="post" novalidate>
                    <div class="mb-3">
                        <label class="form-label">Username or email</label>
                        <input class="form-control" name="identifier" value="{{ identifier or '' }}" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input class="form-control" type="password" name="password" required>
                    </div>
                    <div class="form-check mb-3">
                        <input class="form-check-input" type="checkbox" name="remember" id="remember">
                        <label class="form-check-label" for="remember">Remember me</label>
                    </div>
                    <button class="btn btn-primary w-100" type="submit">Log in</button>
                </form>
                <p class="text-center text-muted mt-3 mb-0">
                    No account? <a href="{{ url_for('auth.signup') }}">Sign up</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
