<div class="feed-card">
    <div class="d-flex align-items-center gap-2 p-3 pb-2">
        <img class="avatar" src="{{ url_for('static', filename=post.author.profile_pic) }}" alt="">
        <div class="flex-grow-1">
            <a class="fw-semibold text-decoration-none" href="{{ url_for('views.profile', username=post.author.username) }}">
                {{ post.author.username }}
            </a>
            <div class="text-muted small">{{ post.created_at.strftime('%b %d, %Y · %H:%M') }}</div>
        </div>
        {% if post.user_id == current_user.id %}
            <form action="{{ url_for('posts.delete_post', post_id=post.id) }}" method="post"
                  onsubmit="return confirm('Delete this post?');">
                <button class="btn btn-sm btn-outline-secondary" type="submit">Delete</button>
            </form>
        {% endif %}
    </div>
    <img class="post-image" src="{{ url_for('static', filename=post.image_path) }}" alt="">
</div>
